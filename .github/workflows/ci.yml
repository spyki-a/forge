name: CI

# Both platforms on every push: Windows, and macOS 14 on arm64.
#
# Windows is the job that says something new on most pushes: most of what
# breaks there breaks in paths, process handling and line endings, all three
# invisible from a Mac until someone runs the app, and in the 2018 ffmpeg
# (docs/EFFECTS.md §25). macOS came back to the push with the AI helper's
# pack (docs/CLIPS.md §3a.6, §16.48 (b)): both runners install the pinned pack
# for real and run the helper's suites from inside it, and `macos-14` is the
# only machine anywhere that runs the pack's macOS 14 floor (onnxruntime's and
# av's arm64 wheels are `macosx_14_0`; the dev Mac is on macOS 26).
#
# The cost. This file used to keep macOS off the push because GitHub billed it
# at TEN times and rounded every job up to a whole minute. Measured then:
#
#     windows-latest              4.3 min  x2  =  10
#     macos-latest                1.4 min  x10 =  20
#     installer (windows-latest)  3.6 min  x2  =   8
#     installer (macos-latest)    1.3 min  x10 =  20
#                                                 --
#                                                 58 billed minutes per push
#
# and it named the condition for putting macOS back: the repo going public,
# which makes Actions on standard runners free. It is public
# (api.github.com/repos/spyki-a/forge: `private: false`, 2026-10-14). What the
# pack adds is an ESTIMATE until a run measures it (§3a.8 row 37): about 5-9
# minutes on Windows and 4-7 on the Mac on a cache miss (the M1 Pro's install
# took 57 s, a runner's download and self-test are slower, and the suites
# from the pack add a few minutes), and a few less on a hit, so roughly
# 9-14 minutes a push on Windows and 6-10 on the Mac, in parallel. Were the
# repo private again, that would bill about 80-130 minutes a push: take
# `macos-14` back off the push before it does.
#
# The installers stay on request (Actions -> CI -> Run workflow) or a `v*`
# tag: see the `if` on `package`.
on:
  push:
    branches: [main]
    # A `v*` tag is the other way to ask for the full matrix and the
    # installers; see the `if` on `package`.
    tags: ['v*']
    # Documentation is a large part of this repo and none of the tests read it.
    # A prose-only commit does not need a runner.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# Pushing three times in twenty minutes used to run three full matrices to
# completion. Only the newest answer is worth anything, so the older ones are
# cancelled. The cost of this is that an intermediate commit on main can end up
# with no verdict of its own — acceptable when the alternative is paying for
# answers nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel Windows because macOS failed. When a run goes red the
      # useful question is "on which platform", and that needs both answers.
      fail-fast: false
      matrix:
        # Both on every push (the header says why, and what it costs).
        # `macos-14` rather than `macos-latest`: an arm64 runner on the pack's
        # macOS floor, which macos-latest would move off without a word.
        os: [windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The sidecar degrades every optional capability, so a bare interpreter
      # is enough for the handshake tests, and `npm test` keeps it with every
      # degraded check (docs/CLIPS.md §16.36). The capabilities themselves are
      # tested from inside the AI helper's pack, after `npm test` below: the
      # pinned interpreter and wheels the app installs, not a pip install here.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # `npm ci` rather than `npm install`: it honours the lockfile exactly, so
      # a run that passes here means the versions on disk are the ones tested.
      # It also fetches the per-platform ffmpeg binary, which is the whole
      # reason the integration tests can run on a runner at all.
      - run: npm ci

      - run: npm run typecheck

      # yt-dlp, kept between runs. exactCut and ytdlpFormat get it the app's
      # own way, `ensureYtDlp()` (src/main/ingest/binary.ts), and under CI they
      # FAIL rather than skip when it cannot be had — so every run fetching it
      # from GitHub made every GitHub hiccup a red build: run 37655072539 went
      # red on Windows in an hour GitHub was answering "Internal Server Error",
      # and the same code re-run as 37655616322 was green (most likely this
      # fetch; the red run's log could not be read). The fetch now tries
      # again (FETCH_RETRY); this makes it about once a week instead of every
      # push — until a green run of the week saves the cache, every push still
      # fetches, because a red job saves nothing.
      #
      # What is cached is the app's MANAGED copy — `<userData>/tools/` under
      # the userData each test points at FORGE_TEST_YTDLP_CACHE — not a file
      # for FORGE_YTDLP. On a miss the tests run the app's real fetch, retries
      # and checksum included, exactly as a user's first download does, and a
      # hit is the copy that fetch verified. FORGE_YTDLP would skip that path
      # altogether, and need a download of its own that nothing verifies.
      # Only `tools/` is kept: exactCut downloads into the same userData.
      #
      # The key is:
      #   - the OS and the ARCHITECTURE: releaseAsset decides by both. Today
      #     both Windows arches get yt-dlp.exe and the Mac's is universal, but
      #     the day an arch gets its own file, a runner restoring another
      #     arch's copy would find it answering --version under emulation and
      #     accept it without a word;
      #   - the ISO week, so a copy is at most a week behind the release a
      #     user would get;
      #   - a hash of the fetch's own code (binary.ts, release.ts). A hit
      #     skips the fetch entirely — the redirect, the real SHA2-256SUMS,
      #     the rename over a fresh exe, its first --version — so without
      #     this a change to that code would not meet GitHub until the next
      #     week, and its failure would land on an unrelated commit. With it,
      #     the push that changes the fetch runs the fetch.
      # Deliberately no restore-keys: an older copy restored would be found as
      # the managed copy, nothing would fetch, and the new key would save that
      # same copy again — the cache would never refresh, and a fetch change
      # would never be fetched. The cache saves only when the job is green.
      # The ISO week, for this cache's key and the AI helper pack's below.
      - name: Name this week's caches
        id: iso-week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/forge-ytdlp/*/userData/tools
          key: yt-dlp-${{ runner.os }}-${{ runner.arch }}-${{ steps.iso-week.outputs.week }}-${{ hashFiles('src/main/ingest/binary.ts', 'src/shared/ingest/release.ts') }}

      # Integration tests included on purpose. They shell out to ffmpeg with
      # real paths, and a runner's Windows path — C:\a\forge\forge — is exactly
      # the shape that breaks filter arguments and concat lists.
      # The github-actions reporter writes each failing test — its file, line
      # and message — as a check annotation, which is readable without a
      # sign-in. Without it a red run says only "exit code 1", and the log
      # behind it needs an account: run 37655072539 could not be read from
      # the sandbox for exactly that reason.
      - run: npm test -- --reporter=default --reporter=github-actions
        env:
          # Where the yt-dlp tests put their userData; cached above.
          FORGE_TEST_YTDLP_CACHE: ${{ runner.temp }}/forge-ytdlp

      # ---------------------------------------------------------------------
      # The AI helper's pack, installed for real (docs/CLIPS.md §3a.6, §3a.9).
      # Six steps, on both runners. The pack lives in one userData for all of
      # them, `<runner.temp>/forge pack é/userData`: a space and a non-ASCII
      # character, as a user's profile name can have (CTranslate2's and
      # mediapipe's non-ASCII paths on Windows are unmeasured, CTranslate2
      # #1227). That path is written out in full at each step that needs it:
      # the `runner` context cannot be used in a job-level `env`.
      # ---------------------------------------------------------------------

      # (1) Every pinned URL, on EVERY push, cache or not: a one-byte range
      # GET each (both platforms' files: 67 URLs for pack 2), asserting
      # 200 or 206, the manifest's length, and a landing host the row and the
      # guide name. Without it a pin deleted from PyPI or GitHub, or a moved
      # redirect host, breaks every tester's Install while CI stays green on
      # the cached pack. Each failure is an annotation.
      - name: Probe every URL the AI helper pack pins
        run: node scripts/probe-pack-urls.mjs

      # (2) The installed pack, kept between runs as yt-dlp's copy is (above):
      # `userData/python`, the receipt and the version folder, nothing else of
      # that userData. The key is the OS and the architecture (each has its
      # own pack); the ISO week, so a real install from the real hosts runs
      # at least weekly; and a hash of everything that decides what an
      # install puts on disk: the manifest, the receipt's rules (pack.ts), the
      # locks, and the job's own code (install, its workers, pip, the check,
      # the unpacker and its tar reader, the stdlib compile, the fetcher). So
      # the push that changes the lock or the installer runs a real install,
      # and every other push checks the cached pack again (helperPack.int's
      # cached mode) and runs the suites from it.
      # Deliberately no restore-keys, for yt-dlp's reason: an older pack
      # restored would be found by the test as a pack whose receipt does not
      # match, reinstalled over, and saved again under the new key only if
      # green, which is a real install with extra steps; worse, a pack whose
      # receipt DID match after an installer change would be accepted
      # without ever running the changed installer. The cache saves only
      # when the job is green (actions/cache's post step runs on success).
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/forge pack é/userData/python
          key: helper-pack-${{ runner.os }}-${{ runner.arch }}-${{ steps.iso-week.outputs.week }}-${{ hashFiles('src/shared/sidecar/packManifest.ts', 'src/shared/sidecar/pack.ts', 'sidecar/pack/lock-*.txt', 'src/main/sidecar/install.ts', 'src/main/sidecar/installDeps.ts', 'src/main/sidecar/pip.ts', 'src/main/sidecar/check.ts', 'src/main/sidecar/unpack.ts', 'src/main/sidecar/compile.ts', 'src/main/net/fetchFile.ts', 'src/shared/assets/tar.ts') }}

      # (3) The app's own install job (Node's fetch, the real hosts) into that
      # userData, or, over a restored pack this build accepts, the job's Check
      # again; then every assertion: the receipt, hello's executable, prefix
      # and every sys.path entry inside the pack, the self-test, pip check.
      # FORGE_PACK_USERDATA is what makes it FAIL rather than skip here (a
      # step with it and without FORGE_PACK_REAL=1 fails), and the pack stays
      # in it for the steps below and for the cache.
      - name: Install the AI helper pack with the app's own job (or check the cached one again)
        run: npx vitest run tests/integration/helperPack.int.test.ts --reporter=default --reporter=github-actions
        env:
          FORGE_PACK_REAL: '1'
          FORGE_PACK_USERDATA: ${{ runner.temp }}/forge pack é/userData

      # The install's own record (stage times, bytes on disk, the longest
      # path, the log): §3a.8 rows 28 and 37 read it from here.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: helper-pack-install-${{ runner.os }}
          retention-days: 30
          if-no-files-found: warn
          path: tests/output/helper-pack/README.txt

      # (4) The helper's suites again, from inside the pack, through the pack
      # rung's own launch (-E -s -u -B, the cleaned environment:
      # tests/integration/venv.ts `FORGE_HELPER_PACK`), never through
      # FORGE_PYTHON, which no installed user runs. A pack that does not run
      # here FAILS every suite that needs it, and sidecarMedia.int's Python
      # cases may skip nothing (venv.ts `pythonCasesGate`). Left out:
      # asr.int, whose jfk.flac fixture and speech model are not seeded into
      # this userData, and salient.int (a 115 MB model, §16.35).
      - name: Run the AI helper's suites from inside the pack
        run: npx vitest run tests/integration/sidecar.int.test.ts tests/integration/sidecarMedia.int.test.ts tests/integration/vision.int.test.ts tests/integration/beats.int.test.ts tests/integration/faces.int.test.ts tests/integration/reframeJob.int.test.ts --reporter=default --reporter=github-actions
        env:
          FORGE_HELPER_PACK: ${{ runner.temp }}/forge pack é/userData

      # What the pack's two steps above left in tests/output, kept whether they
      # passed or not (and so also when the install step failed and the suites
      # never ran): the install's record, each suite's own folder (faces' cache
      # and its layer-by-layer probe, the reframe job's clip and notes), and
      # helper-diag/, every helper's whole stderr and every failure's whole
      # message (tests/integration/helperDiag.ts). The annotations carry the
      # first 4,096 characters of the first ten errors, warnings and notices of
      # a step; this carries the rest, for whoever can sign in. Only these
      # folders: `npm test` leaves hundreds of MB of renders beside them.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-output-${{ runner.os }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            tests/output/helper-pack/
            tests/output/helper-diag/
            tests/output/faces/
            tests/output/reframe-job/
            tests/output/vision/
            tests/output/sidecar-media/

      # (5) pip check from inside the pack, after the suites have run in it:
      # every problem reported must be one the lock leaves out on purpose
      # (mediapipe's two, huggingface-hub's hf-xet once the lock drops it),
      # by membership.
      - name: pip check from inside the AI helper pack
        run: npx vitest run tests/integration/packPipCheck.int.test.ts --reporter=default --reporter=github-actions
        env:
          FORGE_HELPER_PACK: ${{ runner.temp }}/forge pack é/userData

      # (6) Windows: every .pyd and .dll in the installed pack, and each DLL
      # it imports that is neither beside it, nor in python.exe's folder, nor
      # Windows' own, with Microsoft's C++ runtimes always listed and where a
      # copy sits (scripts/pe-imports.py; §16.45, §3a.8 row 30). Compared by
      # membership with tests/fixtures/pack-native-imports-win32.json, so a
      # new need for a runtime fails the push that brings it.
      # THE BOOTSTRAP: the committed list is the interpreter's tree alone,
      # read on the Mac, with `recorded: false`, and while it says so this
      # step compares nothing. It always RECORDS the full pack's list, and
      # the artifact below carries it: the next commit replaces the fixture
      # with that file (`recorded: true`), and from then on it compares.
      - name: List the AI helper pack's native imports
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PACK_N="$(node -e "import('./src/shared/sidecar/packManifest.ts').then((m) => console.log(m.HELPER_PACK.pack))")"
          VERSION_DIR="$RUNNER_TEMP/forge pack é/userData/python/$PACK_N"
          echo "the pack's version folder: $VERSION_DIR"
          python -I scripts/pe-imports.py "$VERSION_DIR" --expected tests/fixtures/pack-native-imports-win32.json --record "$RUNNER_TEMP/pack-native-imports-win32.json" > "$RUNNER_TEMP/pe-imports.stdout.json"

      # `ignore` when the listing did not run (a red step before it): nothing
      # to keep then, and `warn` spent one of the step's annotations saying so.
      - uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Windows'
        with:
          name: helper-pack-native-imports-win32
          retention-days: 30
          if-no-files-found: ignore
          path: ${{ runner.temp }}/pack-native-imports-win32.json

      - run: npm run build

  package:
    name: installer (${{ matrix.os }})
    # Only once the suite is green. An installer built from a red commit is a
    # thing someone will install.
    needs: test
    # Not on every push. An installer is wanted when somebody intends to
    # install something — before a session on the Surface, or at a release —
    # and building one on every commit spent 28 billed minutes a time producing
    # artefacts that expired unused after fourteen days.
    #
    # Run the CI workflow by hand (Actions → CI → Run workflow) to get both, or
    # push a `v*` tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
          - os: macos-latest
            script: pack:mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The reason this job exists at all, and why it cannot run on one runner
      # and cross-compile: `@ffmpeg-installer` ships the binary as an OPTIONAL
      # dependency per platform, so `npm ci` on a Mac installs only
      # darwin-arm64. Packing Windows from macOS yields an installer with no
      # ffmpeg in it — the app then starts and puts up assertBinaries()'s
      # dialog on the user's machine, which is the worst possible place to find
      # out. Each platform packs itself.
      - run: npm ci

      # `npm ci` can exit 0, report no vulnerabilities, and leave
      # node_modules/electron/dist EMPTY — measured on a fresh Windows clone,
      # where npm 11's allow-scripts gate withholds electron's postinstall and
      # its warning names electron-winstaller and esbuild but never electron.
      # It does not happen on macOS with the same npm, and it recurs on every
      # `npm ci` rather than being first-run setup.
      #
      # install.js short-circuits when the binary is already there, so this is
      # a no-op on a healthy tree and a repair on a broken one. The check after
      # it exists because the failure it prevents is silent: packing without
      # this produces either nothing or something that will not start, and
      # electron-builder does not say which.
      - name: Ensure Electron's binary is actually installed
        run: node node_modules/electron/install.js

      # Test the COMMAND, not the variable. `shell: bash` runs under `-e`, so
      # `BIN="$(node …)"` with a failing node aborts the step at the assignment
      # and the annotation below never prints — which is the whole point of it.
      # And `[ -e "$BIN" ]` would be unreachable anyway: electron's index.js
      # re-downloads when dist or path.txt is missing, so `require` either
      # throws or returns a path that exists.
      - name: Verify it before packing
        shell: bash
        run: |
          if ! BIN="$(node -p "require('electron')" 2>&1)"; then
            echo "::error::Electron's binary could not be resolved — npm ci withheld the postinstall. See CLAUDE.md, 'A fresh Windows checkout'."
            echo "$BIN"
            exit 1
          fi
          echo "Electron binary present: $BIN"

      # The library under `assets/` is gitignored, so a CI checkout has none of
      # it — and electron-builder treats a missing extraResources source as
      # nothing to copy rather than as an error. The result is an installer that
      # starts, works, and has a near-empty Library tab, with nothing anywhere
      # saying why. This makes the absence loud: it does not fail the build,
      # because an installer without the asset pack is still worth having, but
      # nobody should discover it by clicking.
      #
      # Since docs/CLIPS.md §6.20 (D10) `assets/fonts` carries four tracked
      # files, the two Noto faces and their licences, so a non-empty `assets/`
      # no longer means a library. The check looks for the library itself,
      # `assets/sfxx`, where the Director's sounds live.
      - name: Say whether the asset library is in this build
        shell: bash
        run: |
          if [ -d assets/sfxx ] && [ -n "$(ls -A assets/sfxx 2>/dev/null)" ]; then
            echo "Asset library present: $(du -sh assets | cut -f1)"
          else
            echo "::warning::No asset library (assets/sfxx) in this checkout — the installer will carry only the two Noto faces in assets/fonts (Noto Sans Devanagari and Noto Sans Telugu), and no other fonts, SFX, transitions, titles or props. The library is gitignored; see docs/ASSETS.md 'Open decision'."
          fi

      - run: npm run ${{ matrix.script }}

      # What actually landed, so the next person does not have to unpack the
      # installer to find out. Every line here is a coupling that cannot fail
      # in development — see docs/PACKAGING.md.
      - name: Report what the package contains
        shell: bash
        run: |
          RES=$(find dist -maxdepth 3 -type d -name resources | head -1)
          echo "resources: $RES"
          for want in assets sidecar app.asar app.asar.unpacked; do
            if [ -e "$RES/$want" ]; then echo "  present: $want"; else echo "  MISSING: $want"; fi
          done

      # Uploaded rather than released. A release is a deliberate act; this is
      # just "something to install on the Surface this afternoon".
      - uses: actions/upload-artifact@v6
        with:
          name: forge-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
